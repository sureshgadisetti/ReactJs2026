<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
    <!-- <script>

    <!-- <script src="react-basics.js"></script> -->

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
        const button = <button>Good job</button>; 
        const paragraph = <p>My Name is Suresh Gadisetti</p>;
        const socks = 100;
        const tshirt = 8
        const totalCost = socks + (tshirt * 2);
        console.log(totalCost);
        const today= dayjs().format('MMMM D');
       console.log(today); 
        setInterval(() => {
        const currentTime= dayjs().format('HH:mm:ss');
      
        const div = (
            <div>
                <h1>Cotton Socks</h1>
                <h2>Price: Rs100</h2>
                <button>Add to Cart</button>
                <p> Total Products Cost : {totalCost}</p>
                 <p>Today is {today}</p>
                 <p>Current Time : {currentTime}</p>
            </div>
        );
      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      
        root.render(div);
      }, 1000);
    </script>
  </body>
